# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.
#
# If you need help with YAML syntax, here are some quick references for you:
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/
#
# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

title: davidw's blog
author:
  email: "david.wetterau@gmail.com"
  name: David Wetterau
description: >- # this means to ignore newlines until "baseurl:"
  David Wetterau's website and blog.
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://davidw.tech" # the base hostname & protocol for your site, e.g. http://example.com
repository: dwetterau/dwetterau.github.io
timezone: America/New_York
twitter_username: dwetterau
github_username: dwetterau
google_analytics: "G-83MQGMDLXV"

# Build settings
# The customized theme is maintained in _layouts, _includes, and _sass.
theme: null
plugins:
  - jekyll-feed
  - jekyll-paginate
  - jekyll-relative-links
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-titles-from-headings

titles_from_headings:
  strip_title: true
  collections: true

paginate: 5
paginate_path: "/page:num"

minima:
  show_excerpts: true
  nav_pages:
    - index.html
  social_links:
    - title: dwetterau on GitHub
      icon: github
      url: "https://github.com/dwetterau"
    - title: Bluesky
      icon: bluesky
      url: "https://bsky.app/profile/dtau.bsky.social"
# Keep historical source and development tools out of the deployed artifact.
exclude:
  - old_website/
  - script/
  - test.sh
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor/
  - node_modules/

sass:
  style: compressed
  sourcemap: never
